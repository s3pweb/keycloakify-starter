name: Publish theme

on: workflow_dispatch

permissions:
    contents: write # create the tag and the release

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: yarn
            - run: yarn install --frozen-lockfile
            # keycloakify build needs Maven and Java, preinstalled on ubuntu-latest
            - run: yarn build-keycloak-theme
            - name: Create new release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: "${{ github.run_id }}-${{ github.run_number }}-${{ github.run_attempt }}"
                  # tag the commit that was built, not the default branch
                  target_commitish: ${{ github.sha }}
                  generate_release_notes: true
                  draft: false
                  files: dist_keycloak/keycloak-theme-*.jar
                  fail_on_unmatched_files: true
                  token: ${{ secrets.GITHUB_TOKEN }}
